<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">tronsmart-elite-linux-rgb</title>
  <desc id="desc">A keycap lit from below: the keyboard backlight, set from Linux.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1F2E"/>
      <stop offset="1" stop-color="#0E1018"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="76" y1="0" x2="180" y2="0">
      <stop offset="0" stop-color="#D97757"/>
      <stop offset="1" stop-color="#F0A27C"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- the keycap: outer skirt, then the top face -->
  <rect x="64" y="60" width="128" height="116" rx="22" fill="none" stroke="#F7F3EE" stroke-width="14"/>
  <rect x="86" y="76" width="84" height="66" rx="12" fill="none" stroke="#9AA3B8" stroke-width="7"/>
  <!-- the backlight under the key -->
  <line x1="76" y1="200" x2="180" y2="200" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
  <g stroke="#F4B393" stroke-width="7" stroke-linecap="round">
    <line x1="96" y1="216" x2="88" y2="228"/>
    <line x1="128" y1="218" x2="128" y2="232"/>
    <line x1="160" y1="216" x2="168" y2="228"/>
  </g>
</svg>
