<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="t">
  <title id="t">tronsmart-elite-linux-rgb: set the Tronsmart Elite keyboard colour from Linux</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1F2E"/>
      <stop offset="1" stop-color="#0E1018"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg2)"/>
  <svg x="110" y="170" width="300" height="300" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1F2E"/>
      <stop offset="1" stop-color="#0E1018"/>
    </linearGradient>
    <linearGradient id="logo-accent" gradientUnits="userSpaceOnUse" x1="76" y1="0" x2="180" y2="0">
      <stop offset="0" stop-color="#D97757"/>
